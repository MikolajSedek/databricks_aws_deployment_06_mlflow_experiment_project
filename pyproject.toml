[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-mlflow-xgboost-experiment"
version = "0.1.0"
description = "Enterprise MLflow 3 & XGBoost Experimentation, Unity Catalog Feature Store & Batch Inference on Databricks AWS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7",
    "mlflow>=3.14.0",
    "xgboost>=2.1.3,<=3.4.1",
    "optuna>=4.1.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.0.0,<3.0.0",
    "pyarrow>=18.0.0",
    "databricks-sdk>=0.167.0",
    "shap>=0.46.0",
    "matplotlib>=3.9.0",
]

[project.scripts]
prepare-uc-features = "src.python.pipelines.prepare_uc_features:main"
train-churn-xgboost = "src.python.pipelines.train_churn_xgboost:main"
train-affinity-xgboost = "src.python.pipelines.train_affinity_xgboost:main"
batch-score-predictions = "src.python.pipelines.batch_score_predictions:main"

[project.optional-dependencies]
dev = [
    "mlflow[databricks,mcp]>=3.14.0",
    "pandas-stubs~=2.3.3",
    "pyspark>=4.0.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "mcp>=1.0.0",
    "ruff>=0.9.0",
    "black>=24.10.0",
    "mypy>=1.14.0",
    "bandit>=1.8.0",
    "detect-secrets>=1.5.0",
    "pydocstyle>=6.3.0",
    "interrogate>=1.7.0",
    "codespell>=2.4.0",
    "yamllint>=1.35.0",
    "pre-commit>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src/python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src/python"]
addopts = "-v --tb=short"
markers = [
    "spark: Tests requiring a local PySpark SparkSession JVM.",
    "mlflow: Tests using an isolated MLflow 3 SQLite tracking & model registry store.",
    "slow: End-to-end integration tests running Optuna HPO, SHAP, and Spark UDF scoring.",
]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = true
fail-under = 95
exclude = ["tests", ".venv", "apm_modules"]

[tool.codespell]
skip = ".git,.venv,uv.lock,apm.lock.yaml,apm_modules,secrets.txt"
ignore-words-list = "nd,te,ot,hist,ines,bu"
