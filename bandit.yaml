# Bandit Security Linter Configuration
# Tailored to detect hardcoded credentials, Databricks Service Principal secrets,
# and AWS secret access keys in Python source code.

assert_used:
  skips: ['*_test.py', '*/test_*.py']

hardcoded_password_string:
  word_list:
    - password
    - pass
    - passwd
    - pwd
    - secret
    - token
    - seckey
    - api_key
    - apikey
    - client_secret
    - service_principal_secret
    - databricks_client_secret
    - databricks_secret
    - aws_secret_access_key
    - aws_session_token
    - aws_secret
    - arm_client_secret

hardcoded_password_funcarg:
  word_list:
    - password
    - pass
    - passwd
    - pwd
    - secret
    - token
    - seckey
    - api_key
    - apikey
    - client_secret
    - service_principal_secret
    - databricks_client_secret
    - databricks_secret
    - aws_secret_access_key
    - aws_session_token
    - aws_secret
    - arm_client_secret

hardcoded_password_default:
  word_list:
    - password
    - pass
    - passwd
    - pwd
    - secret
    - token
    - seckey
    - api_key
    - apikey
    - client_secret
    - service_principal_secret
    - databricks_client_secret
    - databricks_secret
    - aws_secret_access_key
    - aws_session_token
    - aws_secret
    - arm_client_secret
